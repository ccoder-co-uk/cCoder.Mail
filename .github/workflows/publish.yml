# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: publish

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  NUGET_DIRECTORY: ${{ github.workspace }}/artifacts/nuget

defaults:
  run:
    shell: pwsh

jobs:
  build-test-pack:
    runs-on: [self-hosted, Windows, X64, test]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create version number
        id: version
        run: |
          "value=$(Get-Date -Format 'yyyy.M.d.HHmm')" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: |
          $restoreOutput = & dotnet restore src/cCoder.Mail.slnx 2>&1
          $restoreExitCode = $LASTEXITCODE
          $restoreText = $restoreOutput -join [Environment]::NewLine
          $restoreText | Write-Output

          if ($restoreExitCode -ne 0) {
            if ($restoreText -notmatch 'NU1102') {
              exit $restoreExitCode
            }

            Write-Warning 'A required package is not yet visible through the local NuGet HTTP cache; clearing it and retrying once.'
            dotnet nuget locals http-cache --clear
            dotnet restore src/cCoder.Mail.slnx --no-http-cache
          }

      - name: Build
        run: dotnet build src/cCoder.Mail.slnx -c Release --no-restore /p:Version="${{ steps.version.outputs.value }}"

      - name: Test
        run: dotnet test src/cCoder.Mail.slnx -c Release --no-build --filter "Category!=ExternalIntegration"

      - name: Pack
        run: |
          New-Item -ItemType Directory -Path "${{ env.NUGET_DIRECTORY }}" -Force | Out-Null
          dotnet pack src/cCoder.Mail.Providers/cCoder.Mail.Providers.csproj -c Release --no-build --output "${{ env.NUGET_DIRECTORY }}" /p:Version="${{ steps.version.outputs.value }}"
          dotnet pack src/cCoder.Mail/cCoder.Mail.csproj -c Release --no-build --output "${{ env.NUGET_DIRECTORY }}" /p:Version="${{ steps.version.outputs.value }}"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ env.NUGET_DIRECTORY }}/*.nupkg
            !${{ env.NUGET_DIRECTORY }}/*.snupkg

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-test-pack
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          name: nuget
          path: ${{ env.NUGET_DIRECTORY }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish packages
        run: |
          foreach ($file in (Get-ChildItem "${{ env.NUGET_DIRECTORY }}" -Filter *.nupkg)) {
            dotnet nuget push $file.FullName --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          }
